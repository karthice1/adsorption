[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cassia"
version = "0.1.0"
description = "Speciation-constrained, provenance-aware analysis of Cr(VI) removal by carbonaceous adsorbents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "scipy", "pandas", "matplotlib", "scikit-learn", "phreeqpython>=1.5", "adsorption"]

[project.optional-dependencies]
ml = ["xgboost"]
pores = ["pygaps"]
dev = ["pytest"]

[tool.setuptools]
packages = ["cassia"]

[tool.setuptools.package-data]
cassia = []
